<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8472f">
<title>AoE Companion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --brick:#c8472f; --brick-dark:#a53a26; --bg:#1b1a19; --card:#262422; --line:#3a3734; --text:#f2ece4; --muted:#a89f94; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--brick); padding:28px 20px 22px; padding-top:calc(28px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:30px; }
  header p { margin:4px 0 0; opacity:.9; }
  main { padding:18px; max-width:560px; margin:0 auto; }
  .tile { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:12px; color:var(--text); font:inherit; cursor:pointer; }
  .tile b { display:block; font-size:20px; margin-bottom:2px; }
  .tile span { color:var(--muted); font-size:15px; }
  .tile[disabled] { opacity:.5; cursor:default; }
  .tile:not([disabled]):active { background:#2f2c29; }
  input { width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  button.primary { width:100%; padding:14px; border:0; border-radius:10px; background:var(--brick); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .msg { color:#ff9c8a; min-height:1.4em; margin:8px 0; }
  .small { color:var(--muted); font-size:14px; text-align:center; margin-top:24px; }
  .small a { color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>

<!-- ===== SIGN IN ===== -->
<section id="login" class="hidden">
  <header><h1>AoE Companion</h1><p>Sign in with your BeerLog login</p></header>
  <main>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </main>
</section>

<!-- ===== HOME ===== -->
<section id="home" class="hidden">
  <header><h1>AoE Companion</h1><p id="welcome">Age of Empires II</p></header>
  <main>
    <button class="tile" disabled><b>Build Orders</b><span id="boCount">Coming in step 2</span></button>
    <button class="tile" disabled><b>My Stats</b><span>Coming in step 4</span></button>
    <button class="tile" disabled><b>Generate a Build</b><span>Coming in step 5</span></button>
    <div class="small">Profile ID <span id="pid">…</span> · <a href="#" id="logout">Sign out</a></div>
  </main>
</section>

<script>
// ====== EDIT THESE TWO LINES (same values as your BeerLog app) ======
const SUPABASE_URL  = "https://wupafyrlpzxbvhpvpfvg.supabase.co";
const SUPABASE_ANON = "sb_publishable_3O7138aIMet40AwenYXGNQ_5hPBZewU";
// =====================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);

async function showHome(user) {
  $("login").classList.add("hidden");
  $("home").classList.remove("hidden");

  // Make sure there is a settings row, then show the saved profile ID
  await sb.from("aoe_settings").upsert({ user_id: user.id }, { onConflict: "user_id", ignoreDuplicates: true });
  const { data: s } = await sb.from("aoe_settings").select("profile_id").maybeSingle();
  $("pid").textContent = s ? s.profile_id : "?";

  const { count } = await sb.from("aoe_build_orders").select("*", { count: "exact", head: true });
  if (count) $("boCount").textContent = count + " saved";
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showHome(session.user);
  else $("login").classList.remove("hidden");
}

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) $("loginMsg").textContent = error.message;
  else showHome(data.user);
};
$("logout").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

init();
</script>
</body>
</html>
