<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a53a26">
<title>AoE Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --brick:#c8472f; --brick-dark:#8f2f1e; --gold:#e0b04a; --gold-soft:#f1d58b;
    --bg:#1f1814; --bg2:#2a201a; --card:#33271f; --card2:#3d2e24; --line:#5a4333;
    --text:#f6ecdc; --muted:#b9a58c;
    --food:#d65a4a; --wood:#6f9a4e; --goldres:#e0b04a; --stone:#8d98a6; --other:#b9a58c;
    --head:"Cinzel", Georgia, "Times New Roman", serif;
    --body:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body {
    margin:0; min-height:100vh; color:var(--text); font:17px/1.45 var(--body);
    background:
      radial-gradient(900px 420px at 50% -80px, rgba(224,176,74,.16), transparent 70%),
      radial-gradient(600px 400px at 100% 100%, rgba(200,71,47,.10), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
  }
  header {
    position:relative; text-align:center;
    padding:26px 20px 30px; padding-top:calc(26px + env(safe-area-inset-top));
    background: radial-gradient(500px 160px at 50% 0, rgba(255,214,140,.22), transparent 70%), linear-gradient(180deg, #d4503a, var(--brick-dark));
    border-bottom:3px solid var(--gold); box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  header::after {
    content:""; position:absolute; left:0; right:0; bottom:-17px; height:14px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='14'><polygon points='0,0 28,0 14,14' fill='%23e0b04a'/><polygon points='3,0 25,0 14,11' fill='%238f2f1e'/></svg>") repeat-x;
  }
  .crest { width:64px; height:72px; margin:0 auto 6px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.45)); display:block; }
  header h1 { margin:0; font:700 28px/1.1 var(--head); letter-spacing:.06em; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  header p { margin:6px 0 0; color:var(--gold-soft); font-size:15px; }
  header.slim { padding-bottom:22px; text-align:left; }
  header.slim h1 { font-size:24px; padding-right:8px; }
  .back { background:none; border:0; color:var(--gold-soft); font:600 15px var(--body); padding:0 0 8px; cursor:pointer; display:block; }
  .ages { display:flex; justify-content:center; gap:8px; margin:14px 0 0; }
  .age { font:600 12px var(--head); letter-spacing:.04em; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.35); color:rgba(255,255,255,.75); background:rgba(0,0,0,.18); }
  .age.on { background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#3b2410; border-color:var(--gold-soft); }
  main { padding:34px 16px 120px; max-width:560px; margin:0 auto; }

  .tile { position:relative; display:flex; align-items:center; gap:16px; width:100%; text-align:left; padding:18px 18px 18px 22px; margin-bottom:14px; color:var(--text); font:inherit; cursor:pointer;
    background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent); }
  .tile .ico { flex:0 0 50px; height:50px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), rgba(0,0,0,.25)); border:2px solid var(--accent); color:var(--accent); }
  .tile .ico svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tile b { display:block; font:700 19px var(--head); letter-spacing:.03em; }
  .tile span { color:var(--muted); font-size:14.5px; }
  .tile[disabled] { opacity:.55; cursor:default; }
  .tile:not([disabled]):active { transform:translateY(1px); filter:brightness(1.1); }
  .t-build { --accent:var(--wood); } .t-stats { --accent:var(--goldres); } .t-gen { --accent:var(--stone); }

  input { width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid var(--line); background:#241a14; color:var(--text); font:inherit; }
  input:focus, select:focus { outline:2px solid var(--gold); border-color:transparent; }
  select { flex:1; padding:11px; border-radius:10px; border:1px solid var(--line); background:#241a14; color:var(--text); font:inherit; min-width:0; }
  button.primary { width:100%; padding:14px; border:1px solid var(--gold); border-radius:10px; cursor:pointer; background:linear-gradient(180deg, #d4503a, var(--brick-dark)); color:#fff; font:700 16px var(--head); letter-spacing:.08em; }
  button.ghost { width:100%; padding:12px; margin-top:6px; border:1px dashed var(--line); border-radius:10px; cursor:pointer; background:transparent; color:var(--gold-soft); font:600 15px var(--body); }
  .msg { color:#ff9c8a; min-height:1.4em; margin:8px 0; }
  .small { color:var(--muted); font-size:14px; text-align:center; margin-top:26px; }
  .small a { color:var(--gold-soft); }
  .rule { height:1px; margin:26px auto 0; max-width:220px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .hidden { display:none !important; }

  .bcard { display:block; width:100%; text-align:left; background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; color:var(--text); font:inherit; cursor:pointer; }
  .bcard b { font:700 18px var(--head); display:block; }
  .bcard span { color:var(--muted); font-size:14px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--gold-soft); margin-right:6px; }

  details.sec { border-bottom:1px solid var(--line); padding:10px 2px; }
  details.sec summary { font:700 18px var(--head); cursor:pointer; list-style:none; display:flex; justify-content:space-between; }
  details.sec summary::after { content:"›"; color:var(--gold); transition:transform .2s; }
  details.sec[open] summary::after { transform:rotate(90deg); }
  details.sec p { color:var(--muted); margin:8px 0 4px; white-space:pre-line; }
  details.sec .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
  .addrow { display:flex; gap:8px; margin-top:10px; }
  .addrow button { border:1px solid var(--gold); background:var(--card2); color:var(--gold-soft); border-radius:10px; padding:0 16px; font:700 15px var(--body); cursor:pointer; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 12px; font:600 14px var(--body); cursor:pointer; }
  .chip.on { background:var(--gold); color:#3b2410; border-color:var(--gold-soft); }
  .chip.civ::after { content:" ×"; opacity:.7; }
  .facing { margin-top:10px; color:var(--gold-soft); font-size:14.5px; }

  .toggles { margin:16px 0 10px; display:grid; gap:10px; }
  .tog { display:flex; align-items:center; gap:12px; color:var(--text); font-size:16px; cursor:pointer; }
  .tog input { appearance:none; -webkit-appearance:none; width:46px; height:26px; margin:0; border-radius:999px; background:#4a3a2e; position:relative; flex:0 0 46px; padding:0; border:0; transition:background .2s; }
  .tog input::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#f6ecdc; transition:transform .2s; }
  .tog input:checked { background:var(--brick); }
  .tog input:checked::after { transform:translateX(20px); }

  .steps { margin-top:12px; }
  .row { position:relative; display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:start; padding:12px; margin-bottom:8px; border-radius:12px; border:1px solid var(--line); background:linear-gradient(180deg, var(--card2), var(--card)); overflow:hidden; scroll-margin-top:30vh; }
  .row .pop { font:700 17px var(--head); color:var(--gold-soft); text-align:center; line-height:1.1; padding-top:2px; }
  .row .pop small { display:block; font:600 9.5px var(--body); color:var(--muted); letter-spacing:.06em; margin-top:3px; }
  .row .right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .row .secs { color:var(--muted); font-size:13px; text-align:right; padding-top:3px; }
  .row .bar { position:absolute; left:0; bottom:0; height:4px; width:0; background:var(--gold); }
  .row.done { opacity:.4; }
  .row.cur { border-color:var(--gold); box-shadow:0 0 0 2px rgba(224,176,74,.35), 0 6px 18px rgba(0,0,0,.45); background:linear-gradient(180deg,#4a3727,#3a2b20); }
  .it { padding:6px 0; }
  .it + .it { border-top:1px solid rgba(255,255,255,.07); }
  .it .pre { font-size:12.5px; color:var(--gold-soft); font-style:italic; margin-bottom:1px; }
  .it .pre::before { content:"✦ "; font-style:normal; }
  .it .ttl { display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; flex-wrap:wrap; }
  .dot { width:12px; height:12px; border-radius:50%; flex:0 0 12px; background:var(--other); }
  .r-food .dot { background:var(--food); } .r-wood .dot { background:var(--wood); } .r-gold .dot { background:var(--goldres); } .r-stone .dot { background:var(--stone); }
  .it .note { color:var(--muted); font-size:14.5px; margin-top:1px; }
  .it .then { color:var(--gold-soft); font-size:13.5px; margin-top:3px; }
  .it .then::before { content:"→ "; }
  .it.side { margin-left:10px; padding-left:10px; border-left:3px dashed var(--line); }
  .alsotag { font:600 10.5px var(--body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:1px 7px; }
  .opts { display:grid; gap:8px; margin-top:6px; }
  .opt { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:rgba(0,0,0,.18); }
  .opt .ttl { font-size:17px; }
  .opt.best { border-color:var(--gold); background:linear-gradient(180deg, rgba(224,176,74,.22), rgba(224,176,74,.08)); box-shadow:0 0 0 1px rgba(224,176,74,.4); }
  .opt .why { display:none; font-size:13.5px; color:var(--gold-soft); margin-top:3px; }
  .opt.best .why { display:block; }
  .opt.best .ttl::after { content:"★ Best pick"; font:700 11px var(--body); background:var(--gold); color:#3b2410; border-radius:999px; padding:2px 8px; letter-spacing:.04em; }
  .opt.dim { opacity:.6; }
  .or { text-align:center; font:700 12px var(--head); color:var(--muted); letter-spacing:.1em; }

  .row.mile { grid-template-columns:1fr auto; background:linear-gradient(90deg, rgba(224,176,74,.16), rgba(224,176,74,.04)); border-style:dashed; align-items:center; }
  .row.mile .ttl { font:700 16px var(--head); color:var(--gold-soft); display:flex; gap:10px; align-items:center; }
  .row.mile .ttl::before { content:attr(data-badge); font:700 12px var(--head); background:var(--gold); color:#3b2410; border-radius:50%; width:24px; height:24px; display:grid; place-items:center; }
  .compact .row .note, .compact .row .then { display:none; } .compact .row { padding:8px 12px; margin-bottom:5px; } .compact .it .ttl { font-size:16px; } .compact .it .pre { font-size:12px; }

  .fld { display:block; margin:10px 0 0; }
  .fld span { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .fld input, .fld select, .fld textarea { margin:0; }
  textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#241a14; color:var(--text); font:inherit; resize:vertical; }
  textarea:focus { outline:2px solid var(--gold); border-color:transparent; }
  .ecard { border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; background:linear-gradient(180deg, var(--card2), var(--card)); }
  .ecard.mile { border-style:dashed; }
  .eitem, .eopt { border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:12px; background:rgba(0,0,0,.18); }
  .eopt { background:rgba(255,255,255,.04); }
  .ehead { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ehead b { font:700 15px var(--head); color:var(--gold-soft); }
  .ebtns { display:flex; gap:6px; }
  .mini { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; min-width:36px; height:34px; font:700 15px var(--body); cursor:pointer; }
  .erow { display:flex; gap:8px; } .erow > * { flex:1; min-width:0; }
  .hint { color:var(--muted); font-size:13.5px; margin-top:6px; }
  button.danger { color:#ff9c8a; border-color:#7a3a30; }
  .hbtn { position:absolute; right:16px; top:calc(20px + env(safe-area-inset-top)); background:rgba(0,0,0,.25); border:1px solid var(--gold-soft); color:var(--gold-soft); border-radius:999px; padding:6px 16px; font:700 14px var(--body); cursor:pointer; }
  .kebab { display:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--gold); background:rgba(0,0,0,.3); color:var(--gold-soft); font:700 22px/1 var(--body); cursor:pointer; padding:0; }
  .row.sel { outline:2px solid rgba(224,176,74,.55); outline-offset:-2px; }
  .row.sel .kebab { display:block; }
  .sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:flex-end; }
  .sheet { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-top:3px solid var(--gold); border-radius:18px 18px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .sheettitle { font:700 16px var(--head); color:var(--gold-soft); text-align:center; margin-bottom:10px; }
  .sheetbtn { display:block; width:100%; text-align:left; padding:15px 14px; margin-bottom:8px; border-radius:12px; border:1px solid var(--line); background:var(--card2); color:var(--text); font:600 17px var(--body); cursor:pointer; }
  .sheetbtn.cancel { text-align:center; color:var(--muted); background:transparent; }
  .linkbtn { background:none; border:0; color:var(--gold-soft); font:600 15px var(--body); padding:10px 2px 4px; cursor:pointer; text-align:left; }
  .tools2 { justify-content:flex-end; margin-bottom:6px; } .tools2 > * { flex:0 0 auto; padding-left:12px; }
  button.tap { width:100%; text-align:left; background:none; border:0; color:var(--text); font:inherit; cursor:pointer; padding:0; display:flex; align-items:center; gap:10px; }
  .ecard .ehead.tap { padding:2px 0; }
  .ecard:not(.open) { padding:12px 14px; }
  .chev { color:var(--gold); width:14px; flex:0 0 14px; }
  .esum { flex:1; min-width:0; font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .esum.mile { font-family:var(--head); color:var(--gold-soft); }
  .etime { color:var(--muted); font-size:13px; flex:0 0 auto; }
  .ebtnrow { display:flex; justify-content:flex-end; margin:6px 0 2px; }
  .tasks { margin-top:6px; }
  .isum { width:100%; display:flex; align-items:center; gap:8px; background:none; border:0; color:var(--text); font:inherit; text-align:left; cursor:pointer; padding:0; }
  .isum .itxt { flex:1; min-width:0; display:block; }
  .isum .itxt b { display:block; font-size:16px; }
  .isum .itxt small { display:block; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { font:600 10px var(--body); letter-spacing:.05em; text-transform:uppercase; color:var(--gold-soft); border:1px solid var(--line); border-radius:999px; padding:1px 6px; }
  .eitem { margin-top:8px; padding:10px 12px; }
  .eitem.open { padding-bottom:12px; }
  .ehead2 { display:flex; justify-content:space-between; align-items:center; }
  .ehead2 b { font:700 14px var(--head); color:var(--gold-soft); }
  @keyframes flash { 0%,100% { box-shadow:none } 30% { box-shadow:0 0 0 3px var(--gold) } }
  .ecard.flash { animation:flash 1.6s ease 1; }
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; }
  .stat b { display:block; font:700 20px var(--head); color:var(--gold-soft); } .stat span { font-size:12px; color:var(--other); }
  .spark { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; background:var(--card); }
  .sbody { padding:4px 0 6px; }
  .srow { display:grid; grid-template-columns:110px 1fr 92px; gap:8px; align-items:center; padding:6px 0; font-size:14.5px; }
  .srow .sbar { height:8px; border-radius:4px; background:#241b15; overflow:hidden; } .srow .sbar i { display:block; height:100%; background:var(--wood); }
  .srow .snum { text-align:right; color:var(--gold-soft); font-size:13.5px; } .srow .sname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .game { display:flex; flex-direction:column; gap:1px; padding:9px 12px; margin-bottom:6px; border-radius:10px; border:1px solid var(--line); border-left:5px solid var(--line); background:var(--card); font-size:14px; }
  .game b { font:700 15px var(--head); } .game.win { border-left-color:var(--wood); } .game.loss { border-left-color:var(--brick); }
  .dock { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(31,24,20,.96); border-top:2px solid var(--gold); display:flex; gap:10px; align-items:center; justify-content:center; backdrop-filter:blur(6px); z-index:5; }
  .dock .time { font:700 24px var(--head); min-width:78px; text-align:center; }
  .dock button { border:1px solid var(--line); background:var(--card2); color:var(--text); border-radius:10px; height:46px; min-width:46px; padding:0 14px; font:700 16px var(--body); cursor:pointer; }
  .dock button.go { background:linear-gradient(180deg,#d4503a,var(--brick-dark)); border-color:var(--gold); min-width:110px; font-family:var(--head); letter-spacing:.06em; }
</style>
</head>

<script>
const SUPABASE_URL  = "https://wupafyrlpzxbvhpvpfvg.supabase.co";
const SUPABASE_ANON = "sb_publishable_3O7138aIMet40AwenYXGNQ_5hPBZewU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const APP_VERSION = "v4.4";
const VIL_SECS = 25;   // seconds to make one villager
const $app = document.getElementById("app");
let user = null, timer = null, wake = null;

/* ---------- tiny helpers ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "innerHTML") el.innerHTML = v;
    else if (k.startsWith("on")) el[k] = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const store = {
  get(k, d) { try { const v = localStorage.getItem("aoe_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("aoe_" + k, JSON.stringify(v)); } catch {} }
};
const CREST = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "crest"); s.innerHTML = '<use href="#crest"/>'; return s; };
async function holdWake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch {} }

/* ---------- build data (format v2) ----------
   Milestone row : { m:"Feudal Age", age:"feudal" }
   Group row     : { g:"4–6", from:4, to:6, items:[...] }  timed at 25s per villager
                   { g:"18", secs:130, label:"FEUDAL RESEARCH", items:[...] }  timed wait
                   { g:"35+", open:true, items:[...] }  open-ended, stays current
   Item          : { t, d, r (food/wood/gold/stone), pre, then, side }
                   { choice:true, t:"Either", opts:[{t,d,good,why}] }                */

/* ---------- screens ---------- */
function screenLogin() {
  stopTimer();
  const msg = h("div", { class: "msg" });
  const email = h("input", { type: "email", placeholder: "Email", autocomplete: "username" });
  const pass = h("input", { type: "password", placeholder: "Password", autocomplete: "current-password" });
  const btn = h("button", { class: "primary", onclick: async () => {
    msg.textContent = "";
    const { data, error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    if (error) msg.textContent = error.message; else { user = data.user; route(); }
  } }, "ENTER THE KEEP");
  $app.replaceChildren(
    h("header", {}, CREST(), h("h1", {}, "AoE Companion"), h("p", {}, "Sign in with your BeerLog login")),
    h("main", {}, email, pass, btn, msg));
}

async function screenHome() {
  stopTimer();
  const count = h("span", {}, "Loading...");
  const pid = h("span", {}, "...");
  const tile = (cls, title, sub, svg, onclick) => h("button", Object.assign({ class: "tile " + cls }, onclick ? { onclick } : { disabled: "" }),
    h("div", { class: "ico", innerHTML: svg }), h("div", {}, h("b", {}, title), sub));
  const ico = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
  $app.replaceChildren(
    h("header", {}, CREST(), h("h1", {}, "AoE Companion"), h("p", {}, "Age of Empires II"),

const same = (a, b) => {
  if (a === b) return true;
  if (typeof a !== "object" || typeof b !== "object" || !a || !b) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => same(a[k], b[k]));
};
// starter builds you haven't edited yourself are kept up to date with the latest version
async function syncSeeds(rows) {
  let changed = false;
  for (const r of rows) {
    if (r.source !== "seed") continue;
    const s = SEEDS.find(x => x.title === r.title);
    if (s && (!same(s.steps, r.steps) || s.overview !== r.overview)) {
      await sb.from("aoe_build_orders").update({ steps: s.steps, overview: s.overview, strategy: s.strategy }).eq("id", r.id);
      changed = true;
    }
  }
  return changed;
}

async function addMissingSeeds() {
  const { data, error } = await sb.from("aoe_build_orders").select("title");
  if (error) return error.message;
  const have = (data || []).map(r => r.title);
  const rows = SEEDS.filter(s => !have.includes(s.title)).map(s => ({ title: s.title, strategy: s.strategy, overview: s.overview, steps: s.steps, source: "seed" }));
  if (!rows.length) return null;
  const ins = await sb.from("aoe_build_orders").insert(rows);
  return ins.error ? ins.error.message : null;
}

      h("div", { class: "right" }, h("div", { class: "secs" }, s.dur ? fmt(s.dur) : ""), kebab(i)),
      h("div", { class: "bar" }));
    row.addEventListener("click", e => {
      if (e.target.closest(".opt")) return;
      selected = selected === i ? -1 : i;
      rows.forEach((r, j) => r.classList.toggle("sel", j === selected));
    });
    return row;
  });

  function openSheet(i) {
    const close = () => bg.remove();
    const btn = (txt, fn, cls) => h("button", { class: "sheetbtn " + (cls || ""), onclick: () => { close(); fn && fn(); } }, txt);
    const bg = h("div", { class: "sheetbg", onclick: e => { if (e.target === bg) close(); } },
      h("div", { class: "sheet" },
        h("div", { class: "sheettitle" }, tl[i].m ? tl[i].m : "Step " + tl[i].g + (tl[i].label ? " · " + tl[i].label.toLowerCase() : "")),
        btn("✎  Edit this step", () => { location.hash = "#/edit/" + id + "/" + i; }),
        btn("▶  Start the timer from here", () => seek(tl[i].start)),
        btn("Cancel", null, "cancel")));
    document.body.append(bg);
  }

  function updateChoices() {
    const tags = enemyTags();
    facing.textContent = tags.length ? "Facing: " + tags.join(", ") + (enemy.civs.length ? " (" + enemy.civs.join(", ") + ")" : "") : "Add an enemy civ or army type to get Castle Age advice.";
    choices.forEach(opts => {
      const scored = opts.map(x => ({ ...x, hit: (x.o.good || []).filter(g => tags.includes(g)) }));
      const max = Math.max(0, ...scored.map(x => x.hit.length));
      scored.forEach(x => {
        const best = max > 0 && x.hit.length === max;
        x.el.classList.toggle("best", best);
        x.el.classList.toggle("dim", max > 0 && !best);
        x.why.textContent = best ? x.o.why + " · enemy has: " + x.hit.join(", ") : "";
      });
    });
  }
  const saveEnemy = () => { store.set("enemy", enemy); drawChips(); updateChoices(); };

  const facing = h("div", { class: "facing" });
  const chipBox = h("div", { class: "chips" });
  const civSel = h("select", {}, h("option", { value: "" }, "Add enemy civ..."), Object.keys(CIV_TAGS).map(c => h("option", { value: c }, c)));
  const drawChips = () => {
    chipBox.replaceChildren(
      ...enemy.civs.map(c => h("button", { class: "chip civ on", onclick: () => { enemy.civs = enemy.civs.filter(x => x !== c); saveEnemy(); } }, c)),
      ...TAGS.map(g => h("button", { class: "chip" + (enemy.tags.includes(g) ? " on" : ""), onclick: () => { enemy.tags = enemy.tags.includes(g) ? enemy.tags.filter(x => x !== g) : [...enemy.tags, g]; saveEnemy(); } }, g)));
  };
  const matchup = h("details", { class: "sec", open: "" }, h("summary", {}, "Matchup"),
    h("div", { class: "addrow" }, civSel, h("button", { onclick: () => { if (civSel.value && !enemy.civs.includes(civSel.value)) { enemy.civs.push(civSel.value); saveEnemy(); } civSel.value = ""; } }, "Add")),
    chipBox, facing);

  const stepsEl = h("div", { class: "steps" + (store.get("compact", false) ? " compact" : "") }, rows);
  const toggle = (key, label, def, onchange) => {
    const cb = h("input", { type: "checkbox" }); cb.checked = store.get(key, def);
    cb.onchange = () => { store.set(key, cb.checked); onchange && onchange(cb.checked); };
    return h("label", { class: "tog" }, cb, label);
  };
  const sec = (title, text) => text ? h("details", { class: "sec", open: title === "Build Overview" ? "" : null }, h("summary", {}, title), h("p", {}, text)) : null;

  const timeEl = h("div", { class: "time" }, "0:00");
  const goBtn = h("button", { class: "go" }, "START");
  const dock = h("div", { class: "dock" },
    h("button", { onclick: () => stepBy(-1), "aria-label": "Previous step" }, "‹"),
    goBtn, timeEl,
    h("button", { onclick: () => stepBy(1), "aria-label": "Next step" }, "›"),
    h("button", { onclick: () => reset(), "aria-label": "Reset" }, "⟲"));

  $app.replaceChildren(
    h("header", { class: "slim" }, h("button", { class: "back", onclick: () => location.hash = "#/builds" }, "‹ Build Orders"),
      h("button", { class: "hbtn", onclick: () => location.hash = "#/edit/" + id }, "Edit"),
      h("h1", {}, b.title), h("p", {}, "Build Guide" + (b.civ ? " · " + b.civ : ""))),
    h("main", {},
      sec("Build Overview", b.overview), sec("Pros & Cons", [b.pros, b.cons].filter(Boolean).join("\n\n")), sec("Tips", b.tips),
      matchup,
      h("div", { class: "toggles" },
        toggle("compact", "Use compact/simplified mode", false, on => stepsEl.classList.toggle("compact", on)),
        toggle("autoscroll", "Enable autoscroll", true)),
      stepsEl),
    dock);
  drawChips(); updateChoices();

  /* ---- timer ---- */
  let elapsed = 0, running = false, last = 0, curIdx = -1;
  function currentIdx() {
    if (!timed.length) return -1;
    const hit = timed.find(i => !tl[i].open && elapsed >= tl[i].start && elapsed < tl[i].start + tl[i].dur);
    if (hit !== undefined) return hit;
    if (elapsed >= total) return timed[timed.length - 1];
    return timed[0];
  }
  function paint() {
    timeEl.textContent = fmt(elapsed);
    const cur = currentIdx();
    const started = running || elapsed > 0;
    rows.forEach((r, i) => {
      const s = tl[i]; let done = false, isCur = false, pct = 0;
      if (s.m) { const n = linked(i); done = n !== undefined && elapsed >= tl[n].start && started && elapsed > 0; }
      else if (timed.includes(i)) {
        if (s.open) { isCur = started && elapsed >= s.start; }
        else { done = elapsed >= s.start + s.dur; isCur = started && i === cur && !done; pct = isCur ? ((elapsed - s.start) / s.dur) * 100 : (done ? 100 : 0); }
      } else { const n = linked(i); if (n !== undefined) { done = elapsed >= tl[n].start + tl[n].dur && !tl[n].open; isCur = started && n === cur && !done; } }
      r.classList.toggle("done", done && !isCur);
      r.classList.toggle("cur", isCur);
      const bar = r.querySelector(".bar"); if (bar) bar.style.width = Math.min(100, pct) + "%";
    });
    if (cur !== curIdx) {
      curIdx = cur;
      if (started && cur >= 0 && store.get("autoscroll", true)) rows[cur].scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  function tick() { const now = Date.now(); elapsed += (now - last) / 1000; last = now; if (!hasOpen && elapsed >= total) { elapsed = total; pause(); return; } paint(); }
  function start() { if (!hasOpen && elapsed >= total) elapsed = 0; running = true; last = Date.now(); goBtn.textContent = "PAUSE"; timer = setInterval(tick, 250); holdWake(); paint(); }
  function pause() { running = false; goBtn.textContent = "START"; stopTimer(); paint(); }
  function reset() { pause(); elapsed = 0; curIdx = -1; paint(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function seek(sec) { elapsed = sec; last = Date.now(); curIdx = -1; paint(); }
  function stepBy(d) {
    const here = timed.findIndex(i => !tl[i].open ? (elapsed >= tl[i].start && elapsed < tl[i].start + tl[i].dur) : elapsed >= tl[i].start);
    const to = Math.min(timed.length - 1, Math.max(0, (here < 0 ? 0 : here) + d));
    seek(tl[timed[to]].start);
  }
  goBtn.onclick = () => running ? pause() : start();
  paint();
}

/* ---------- stats ---------- */
const API_URL = pid => "https://aoe-api.worldsedgelink.com/community/leaderboard/getRecentMatchHistory?title=age2&profile_ids=" + encodeURIComponent("[" + pid + "]");
const CIV_NAMES = ["Aztecs","Berbers","Britons","Bulgarians","Burmese","Byzantines","Celts","Chinese","Cumans","Ethiopians","Franks","Goths","Huns","Incas","Hindustanis","Italians","Japanese","Khmer","Koreans","Lithuanians","Magyars","Malay","Malians","Mayans","Mongols","Persians","Portuguese","Romans","Saracens","Slavs","Spanish","Tatars","Teutons","Turks","Vietnamese","Vikings","Burgundians","Sicilians","Poles","Bohemians","Bengalis","Dravidians","Gurjaras"];
const MATCH_TYPES = { 2:"1v1 Death Match",3:"2v2 Death Match",4:"3v3 Death Match",5:"4v4 Death Match",6:"1v1 Random Map",7:"2v2 Random Map",8:"3v3 Random Map",9:"4v4 Random Map",10:"Battle Royale",26:"1v1 Empire Wars",27:"2v2 Empire Wars",28:"3v3 Empire Wars",29:"4v4 Empire Wars",60:"Custom DM 1v1",61:"Custom DM Team" };
const MODE_FILTERS = [["all","All"],["1v1","1v1 Random Map"],["team","Team Random Map"],["other","Other"]];
const modeOf = mt => mt === 6 ? "1v1" : (mt === 7 || mt === 8 || mt === 9) ? "team" : "other";
const civOverrides = () => store.get("civ_names", {});
const civName = id => id == null ? "?" : (civOverrides()[id] || CIV_NAMES[id] || ("Civ #" + id));
const MAP_FIX = { nomad:"Nomad", megarandom:"Mega Random", goldenpit:"Golden Pit", goldenswamp:"Golden Swamp", africanclearing:"African Clearing", fourlakes:"Four Lakes", blackforest:"Black Forest", ghostlake:"Ghost Lake", nildelta:"Nile Delta", arabia:"Arabia", arena:"Arena", islands:"Islands", yucatan:"Yucatan", fortress:"Fortress", mediterranean:"Mediterranean", michi:"Michi", kilimanjaro:"Kilimanjaro", valley:"Valley", acropolis:"Acropolis", serengeti:"Serengeti" };
const mapOverrides = () => store.get("map_names", {});
const mapName = f => {
  if (!f) return "Unknown";
  if (mapOverrides()[f]) return mapOverrides()[f];
  let n = String(f).replace(/\.(rms2?|scx|scn)$/i, "").replace(/^(rm|aoe2|ranked|map)[_-]/i, "");
  const key = n.toLowerCase().replace(/[^a-z]/g, "");
  if (MAP_FIX[key]) return MAP_FIX[key];
  return n.replace(/[_-]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b\w/g, c => c.toUpperCase());
};

let lastApi = "", lastFirst = "";
async function fetchMatches(pid) {
  let j;
  const viaProxy = await sb.functions.invoke("aoe-proxy", { body: { pid } });
  if (!viaProxy.error && viaProxy.data && viaProxy.data.message && !viaProxy.data.matchHistoryStats) throw new Error("the aoe-proxy function still has Supabase's sample code. Paste in the code from aoe-proxy.ts and Deploy again");
  if (!viaProxy.error && viaProxy.data && !viaProxy.data.error) j = viaProxy.data;
  else {
    const res = await fetch(API_URL(pid));
    if (!res.ok) throw new Error("API answered " + res.status);
    j = await res.json();
  }
  lastApi = JSON.stringify(j).slice(0, 1800);
  lastFirst = j.matchHistoryStats && j.matchHistoryStats[0] ? JSON.stringify(j.matchHistoryStats[0]).slice(0, 2500) : "";
  const names = {};
  for (const p of j.profiles || []) names[p.profile_id] = p.alias || p.name || ("Player " + p.profile_id);
  const rows = [];
  for (const m of j.matchHistoryStats || []) {
    const results = m.matchhistoryreportresults || [], members = m.matchhistorymember || [];
    const me = results.find(r => Number(r.profile_id) === Number(pid));
    if (!me) continue;
    const memOf = id => members.find(r => Number(r.profile_id) === Number(id)) || {};
    const civOf = id => { const r = results.find(x => Number(x.profile_id) === Number(id)) || {}; const mm = memOf(id);
      const v = r.race_id ?? mm.race_id ?? r.civilization_id ?? mm.civilization_id; return v == null ? null : Number(v); };
    const mem = memOf(pid);
    const players = results.map(r => ({ pid: r.profile_id, name: names[r.profile_id] || ("Player " + r.profile_id), civ: civOf(r.profile_id), team: r.teamid, won: r.resulttype === 1 }));
    rows.push({
      match_id: m.id,
      played_at: m.startgametime ? new Date(m.startgametime * 1000).toISOString() : null,
      map: mapName(m.mapname),
      civ: civName(civOf(pid)),
      won: me.resulttype === 1,
      old_rating: mem.oldrating > 0 ? mem.oldrating : null,
      new_rating: mem.newrating > 0 ? mem.newrating : null,
      raw: { mt: m.matchtype_id, race_id: civOf(pid), mapfile: m.mapname, secs: (m.completiontime || 0) - (m.startgametime || 0), team: me.teamid, players }
    });
  }
  return rows;
}

async function screenStats() {
  stopTimer();
  let all = [], mode = "all", pid = 21963928;
  const body = h("div", {}, h("div", { class: "small" }, "Loading..."));
  const status = h("div", { class: "small" });
  $app.replaceChildren(
    h("header", { class: "slim" }, h("button", { class: "back", onclick: () => location.hash = "#/" }, "‹ Home"), h("h1", {}, "My Stats")),
    h("main", {}, body, status));

  const loadSaved = async () => {
    const { data, error } = await sb.from("aoe_matches").select("*").order("played_at", { ascending: false }).limit(2000);
    if (error) throw new Error(error.message);
    all = data || [];
  };
  const refresh = async () => {
    status.textContent = "Fetching your recent games...";
    try {
      const rows = await fetchMatches(pid);
      if (rows.length) {
        const up = await sb.from("aoe_matches").upsert(rows, { onConflict: "user_id,match_id" });
        if (up.error) throw new Error(up.error.message);
      }
      await loadSaved();
      status.replaceChildren("Updated: " + rows.length + " games from the API, " + all.length + " saved in total.",
        rows.length ? "" : h("details", { class: "sec" }, h("summary", {}, "Show what the API sent back"), h("pre", { style: "white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--other)" }, lastApi)));
    } catch (e) {
      status.replaceChildren(h("div", { class: "msg" }, "Couldn't fetch from the game API: " + e.message +
        (e instanceof TypeError ? " (deploy the aoe-proxy function in Supabase, see the steps)" : "")));
    }
    paint();
  };

  const rowsFor = () => all.map(r => Object.assign({}, r, { map: r.raw && r.raw.mapfile ? mapName(r.raw.mapfile) : r.map, civ: r.raw && r.raw.race_id != null ? civName(r.raw.race_id) : r.civ, mt: r.raw && r.raw.mt }))
    .filter(r => mode === "all" || modeOf(r.mt) === mode);
  const pct = (w, n) => n ? Math.round(100 * w / n) + "%" : "–";
  const group = (rows, key) => {
    const g = {};
    for (const r of rows) { const k = r[key] || "?"; (g[k] = g[k] || { n: 0, w: 0 }); g[k].n++; if (r.won) g[k].w++; }
    return Object.entries(g).sort((a, b) => b[1].n - a[1].n);
  };
  const table = (title, entries) => h("details", { class: "sec", open: "" }, h("summary", {}, title),
    h("div", { class: "sbody" }, entries.length ? entries.slice(0, 15).map(([k, v]) =>
      h("div", { class: "srow" }, h("span", { class: "sname" }, k), h("span", { class: "sbar" }, h("i", { style: "width:" + Math.round(100 * v.w / v.n) + "%" })),
        h("span", { class: "snum" }, pct(v.w, v.n) + " · " + v.w + "-" + (v.n - v.w))))
      : h("div", { class: "small" }, "No games yet.")));
  const spark = rows => {
    const pts = rows.filter(r => r.new_rating).slice().reverse().map(r => r.new_rating);
    if (pts.length < 2) return null;
    const lo = Math.min(...pts), hi = Math.max(...pts), W = 300, H = 70, pad = 6;
    const d = pts.map((v, i) => (pad + i * (W - 2 * pad) / (pts.length - 1)).toFixed(1) + "," + (H - pad - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (H - 2 * pad)).toFixed(1)).join(" ");
    return h("div", { class: "spark" }, h("div", { class: "small" }, "Rating: " + lo + " – " + hi + " (last " + pts.length + " games)"),
      h("div", { innerHTML: `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${d}" fill="none" stroke="#e0b04a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>` }));
  };
  let fixOpen = false;
  const fixPanel = () => {
    const civs = {}, maps = {};
    for (const r of all) {
      const raw = r.raw || {};
      if (raw.mapfile) { maps[raw.mapfile] = (maps[raw.mapfile] || 0) + 1; }
      const ids = new Set([raw.race_id, ...((raw.players || []).map(x => x.civ))].filter(x => x != null));
      for (const id of ids) civs[id] = (civs[id] || 0) + 1;
    }
    const unknown = Object.keys(civs).filter(id => !CIV_NAMES[id] && !civOverrides()[id]).length;
    const line = (label, ph, key, mapObj, saveKey) => h("div", { class: "addrow" },
      h("span", { class: "small", style: "min-width:150px;align-self:center" }, label),
      h("input", { placeholder: ph, value: (store.get(saveKey, {})[key]) || "", onchange: e => { const o = store.get(saveKey, {}); if (e.target.value.trim()) o[key] = e.target.value.trim(); else delete o[key]; store.set(saveKey, o); paint(); } }));
    return h("details", Object.assign({ class: "sec", ontoggle: e => { fixOpen = e.target.open; } }, fixOpen ? { open: "" } : {}),
      h("summary", {}, "Fix civ & map names" + (unknown ? " (" + unknown + " civs unknown)" : "")),
      h("div", { class: "sbody" },
        h("div", { class: "small" }, "Type the right name to override. Saved on this device. Leave blank to use the automatic name."),
        h("b", { style: "display:block;margin:10px 0 4px" }, "Civilizations"),
        Object.keys(civs).sort((a, b) => civs[b] - civs[a]).map(id => line("#" + id + " now: " + civName(Number(id)) + " (" + civs[id] + ")", civName(Number(id)), id, civs, "civ_names")),
        h("b", { style: "display:block;margin:10px 0 4px" }, "Maps"),
        Object.keys(maps).sort((a, b) => maps[b] - maps[a]).map(f => line(f + " now: " + mapName(f) + " (" + maps[f] + ")", mapName(f), f, maps, "map_names"))));
  };
  const playersLine = r => {
    const pl = (r.raw && r.raw.players) || [];
    if (!pl.length) return null;
    const lab = x => (x.name || "?") + (x.civ != null ? " (" + civName(x.civ) + ")" : "");
    const team = r.raw.team;
    const mates = pl.filter(x => x.team === team && Number(x.pid) !== Number(pid)).map(lab);
    const foes = pl.filter(x => x.team !== team).map(lab);
    return h("span", { class: "small" }, (mates.length ? "With " + mates.join(", ") + " · " : "") + "vs " + foes.join(", "));
  };
  function paint() {
    const rows = rowsFor();
    const wins = rows.filter(r => r.won).length;
    const rated = rows.filter(r => r.new_rating);
    let streak = 0;
    for (const r of rows) { if (r.won === rows[0].won) streak++; else break; }
    body.replaceChildren(
      h("div", { style: "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" },
        MODE_FILTERS.map(([k, l]) => h("button", { class: "chip" + (mode === k ? " on" : ""), onclick: () => { mode = k; paint(); } }, l))),
      h("div", { class: "statgrid" },
        [["Games", rows.length], ["Win rate", pct(wins, rows.length)], ["Rating", rated.length ? rated[0].new_rating : "–"], ["Streak", rows.length ? streak + (rows[0].won ? "W" : "L") : "–"]]
          .map(([l, v]) => h("div", { class: "stat" }, h("b", {}, String(v)), h("span", {}, l)))),
      spark(rows),
      table("By civilization", group(rows, "civ")),
      table("By map", group(rows, "map")),
      table("Against civilization", (() => { const g = {}; for (const r of rows) for (const pl of (r.raw && r.raw.players) || []) { if (pl.team === r.raw.team || pl.civ == null) continue; const k = civName(pl.civ); (g[k] = g[k] || { n: 0, w: 0 }); g[k].n++; if (r.won) g[k].w++; } return Object.entries(g).sort((a, b) => b[1].n - a[1].n); })()),
      h("details", { class: "sec", open: "" }, h("summary", {}, "Recent games"),
        h("div", { class: "sbody" }, rows.slice(0, 25).map(r => {
          const diff = r.old_rating && r.new_rating ? r.new_rating - r.old_rating : null;
          return h("div", { class: "game " + (r.won ? "win" : "loss") },
            h("b", {}, (r.won ? "Win" : "Loss") + " · " + r.civ), h("span", {}, r.map + " · " + (MATCH_TYPES[r.mt] || "Match") + ((r.raw && r.raw.secs > 0) ? " · " + fmt(r.raw.secs) : "")),
            playersLine(r),
            h("span", { class: "small" }, (r.played_at ? new Date(r.played_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "") + (diff != null ? " · " + (diff > 0 ? "+" : "") + diff + " rating" : "")));
        }))),
      fixPanel(),
      lastFirst ? h("details", { class: "sec" }, h("summary", {}, "Debug: raw first game"), h("pre", { style: "white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--other)" }, lastFirst)) : null,
      h("button", { class: "primary", style: "margin-top:14px", onclick: refresh }, "REFRESH FROM GAME API"));
  }

  try {
    const { data: s } = await sb.from("aoe_settings").select("profile_id").maybeSingle();
    if (s && s.profile_id) pid = Number(s.profile_id);
    await loadSaved();
  } catch (e) { body.replaceChildren(h("div", { class: "msg" }, e.message)); return; }
  paint();
  refresh();
}

/* ---------- router ---------- */
function route() {
  if (!user) return screenLogin();
  const p = location.hash.replace(/^#\/?/, "");
  window.scrollTo(0, 0);
  if (p.startsWith("build/")) return screenBuild(p.slice(6));
  if (p.startsWith("edit/")) { const [eid, idx] = p.slice(5).split("/"); return screenEdit(eid, idx !== undefined ? Number(idx) : undefined); }
  if (p === "builds") return screenBuilds();
  if (p === "stats") return screenStats();
  return screenHome();
}
window.addEventListener("hashchange", route);
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  user = session ? session.user : null;
  route();
})();
</script>
